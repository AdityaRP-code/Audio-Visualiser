<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWave // Minimal Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Custom Audio-Reactive Cursor -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Visualizer Canvas -->
  <main class="canvas-container">
    <canvas id="visualizerCanvas"></canvas>
  </main>

  <!-- Overlay UI -->
  <div class="ui-wrapper">
    <!-- Top Navigation -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">PulseWave</span>
      </div>

      <div class="header-actions">
        <span class="badge" id="fpsCounter">60 FPS</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme" title="Toggle Light/Dark Mode">
          <!-- Sun Icon (shown in dark mode) -->
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Center Status Indicator -->
    <div class="center-banner" id="centerBanner">
      <h2>Audio Visualizer</h2>
      <p>Drop audio, start demo, or stream microphone</p>
    </div>

    <!-- Minimal Floating Dock -->
    <footer class="control-dock">
      <div class="dock-panel">
        <!-- Audio Source Controls -->
        <div class="action-group">
          <label class="btn-action file-btn" for="audioUpload" title="Upload Audio File">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Upload</span>
            <input type="file" id="audioUpload" accept="audio/*" />
          </label>

          <button class="btn-action" id="btnMic" title="Use Live Microphone">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span>Mic</span>
          </button>

          <button class="btn-action primary" id="btnPlayPause" title="Toggle Audio Playback">
            <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span id="playText">Play Demo</span>
          </button>
        </div>

        <div class="divider"></div>

        <!-- Mode Selectors -->
        <div class="segmented-control">
          <button class="segment-btn active" data-mode="radial">Radial</button>
          <button class="segment-btn" data-mode="bars">Bars</button>
          <button class="segment-btn" data-mode="particles">Nebula</button>
        </div>

        <div class="divider"></div>

        <!-- Parameters -->
        <div class="controls-row">
          <div class="control-item">
            <label for="gainSlider">GAIN</label>
            <input type="range" id="gainSlider" min="0" max="2" step="0.05" value="1" />
          </div>

          <div class="control-item">
            <label for="colorPicker">ACCENT</label>
            <input type="color" id="colorPicker" value="#09090b" />
          </div>
        </div>
      </div>
    </footer>
  </div>

  <audio id="audioElement" crossOrigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
