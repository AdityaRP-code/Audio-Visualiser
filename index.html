<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWave // Audio Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts for sleek futuristic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Custom Audio-Reactive Cursor Elements -->
  <div class="custom-cursor-dot" id="cursorDot"></div>
  <div class="custom-cursor-ring" id="cursorRing"></div>

  <!-- Ambient Animated Background Gradients -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Canvas Container -->
  <main class="canvas-container">
    <canvas id="visualizerCanvas"></canvas>
  </main>

  <!-- Overlay UI Controls -->
  <section class="ui-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="icon">∿</span>
        <span class="text">PULSE<span class="highlight">WAVE</span></span>
      </div>
      <div class="stats-badge" id="fpsCounter">FPS: 60</div>
    </header>

    <!-- Center Idle Prompt (Hides on playback) -->
    <div class="center-banner" id="centerBanner">
      <h2>IMMERSIVE FREQUENCY ENGINE</h2>
      <p>Upload a track, activate your microphone, or run the demo tone.</p>
    </div>

    <!-- Control Dock -->
    <footer class="control-dock">
      <div class="dock-panel">
        
        <!-- Audio Source Controls -->
        <div class="btn-group">
          <label class="btn-action file-label" for="audioUpload" title="Load Audio File">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Upload Track</span>
            <input type="file" id="audioUpload" accept="audio/*" />
          </label>

          <button class="btn-action" id="btnMic" title="Use Live Microphone">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span>Mic Live</span>
          </button>

          <button class="btn-action primary" id="btnPlayPause" title="Toggle Demo / Playback">
            <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="playText">Play Demo</span>
          </button>
        </div>

        <div class="divider"></div>

        <!-- Mode Selectors -->
        <div class="mode-selector">
          <span class="label">MODE</span>
          <div class="pill-group">
            <button class="pill-btn active" data-mode="radial">Radial</button>
            <button class="pill-btn" data-mode="bars">Bars</button>
            <button class="pill-btn" data-mode="particles">Nebula</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Volume & Sensitivity Sliders -->
        <div class="dock-sliders">
          <div class="slider-item">
            <label for="gainSlider">GAIN</label>
            <input type="range" id="gainSlider" min="0" max="2" step="0.05" value="1" />
          </div>
          <div class="slider-item">
            <label for="colorPicker">ACCENT</label>
            <input type="color" id="colorPicker" value="#00f3ff" />
          </div>
        </div>

      </div>
    </footer>
  </section>

  <!-- Audio Node (Hidden) -->
  <audio id="audioElement" crossOrigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
